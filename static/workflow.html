  <head>

    <style>
      :root {
        --color-background-primary: #141414;
        --color-background-secondary: #1e1e1e;
        --color-background-info: rgba(59, 130, 246, 0.1);
        --color-background-danger: rgba(239, 68, 68, 0.1);
        --color-background-warning: rgba(245, 158, 11, 0.1);
        --color-background-success: rgba(34, 197, 94, 0.1);
        --color-text-primary: #e8e4dc;
        --color-text-secondary: #888888;
        --color-text-info: #93c5fd;
        --color-text-danger: #fca5a5;
        --color-text-warning: #fcd34d;
        --color-text-success: #86efac;
        --color-border-tertiary: rgba(255, 255, 255, 0.08);
        --color-border-secondary: rgba(255, 255, 255, 0.18);
        --color-border-primary: rgba(255, 255, 255, 0.35);
        --color-border-info: rgba(59, 130, 246, 0.5);
        --color-border-danger: rgba(239, 68, 68, 0.5);
        --color-border-warning: rgba(245, 158, 11, 0.5);
        --color-border-success: rgba(34, 197, 94, 0.5);
        --font-mono: "DM Mono", "Courier New", monospace;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0f0f0f;
        color: var(--color-text-primary);
        font-family: var(--font-mono);
        padding: 2rem 1.5rem 4rem;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .root {
        padding: 1rem 0;
        font-family: var(--font-mono);
      }
      .top-nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
      }
      .nav-btn {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        padding: 6px 14px;
        border-radius: var(--border-radius-md);
        border: 0.5px solid var(--color-border-secondary);
        background: transparent;
        color: var(--color-text-secondary);
        cursor: pointer;
        transition: all 0.15s;
      }
      .nav-btn:hover {
        background: var(--color-background-secondary);
        color: var(--color-text-primary);
      }
      .nav-btn.active {
        background: var(--color-background-secondary);
        color: var(--color-text-primary);
        border-color: var(--color-border-primary);
      }
      .flow-title {
        font-size: 11px;
        letter-spacing: 0.2em;
        color: var(--color-text-secondary);
        margin-bottom: 1.25rem;
        text-transform: uppercase;
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
      }
      .panel {
        background: var(--color-background-secondary);
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: var(--border-radius-lg);
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-label {
        font-size: 10px;
        letter-spacing: 0.15em;
        color: var(--color-text-secondary);
        text-transform: uppercase;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 0.08em;
        padding: 3px 10px;
        border-radius: 20px;
        border: 0.5px solid var(--color-border-secondary);
        color: var(--color-text-secondary);
        transition: all 0.3s;
      }
      .badge.live {
        border-color: var(--color-border-warning);
        color: var(--color-text-warning);
      }
      .speed-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .speed-row label {
        font-size: 10px;
        color: var(--color-text-secondary);
        white-space: nowrap;
      }
      .speed-row input[type="range"] {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 2px;
        background: var(--color-border-secondary);
        border-radius: 2px;
        outline: none;
      }
      .speed-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--color-text-primary);
        cursor: pointer;
      }
      .speed-val {
        font-size: 10px;
        color: var(--color-text-primary);
        min-width: 32px;
        text-align: right;
      }
      .btns {
        display: flex;
        gap: 8px;
      }
      .fire-btn {
        flex: 1;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        padding: 8px;
        border-radius: var(--border-radius-md);
        border: 0.5px solid var(--color-border-primary);
        background: transparent;
        color: var(--color-text-primary);
        cursor: pointer;
        transition: all 0.15s;
      }
      .fire-btn:hover {
        background: var(--color-background-primary);
      }
      .fire-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .reset-btn {
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 8px 12px;
        border-radius: var(--border-radius-md);
        border: 0.5px solid var(--color-border-tertiary);
        background: transparent;
        color: var(--color-text-secondary);
        cursor: pointer;
      }
      .reset-btn:hover {
        color: var(--color-text-primary);
      }
      .sec-label {
        font-size: 9px;
        letter-spacing: 0.18em;
        color: var(--color-text-secondary);
        opacity: 0.6;
        text-transform: uppercase;
        margin-bottom: 4px;
        padding-left: 2px;
      }
      .domino-row {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 10px;
      }
      .domino {
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: var(--border-radius-md);
        padding: 8px 10px;
        opacity: 0.15;
        transform: translateX(-8px);
        transition:
          opacity 0.45s,
          transform 0.45s,
          border-color 0.45s,
          background 0.45s;
      }
      .domino.fired {
        opacity: 1;
        transform: translateX(0);
      }
      .domino.fired.info {
        border-color: var(--color-border-info);
        background: var(--color-background-info);
      }
      .domino.fired.lock {
        border-color: var(--color-border-danger);
        background: var(--color-background-danger);
      }
      .domino.fired.warn {
        border-color: var(--color-border-warning);
        background: var(--color-background-warning);
      }
      .domino.fired.open {
        border-color: var(--color-border-success);
        background: var(--color-background-success);
      }
      .domino.fired.neutral {
        border-color: var(--color-border-secondary);
        background: var(--color-background-secondary);
      }
      .dom-title {
        font-size: 12px;
        font-weight: 500;
        color: var(--color-text-primary);
        margin-bottom: 2px;
      }
      .dom-sub {
        font-size: 11px;
        color: var(--color-text-secondary);
        line-height: 1.4;
      }
      .domino.fired.info .dom-title {
        color: var(--color-text-info);
      }
      .domino.fired.lock .dom-title {
        color: var(--color-text-danger);
      }
      .domino.fired.warn .dom-title {
        color: var(--color-text-warning);
      }
      .domino.fired.open .dom-title {
        color: var(--color-text-success);
      }
    </style>

                },
                {
                  t: "Excludes blocked dates",
                  s: "room_blocks JOIN check",
                  e: "neutral",
                },
              ],
            },
            {
              label: "audit",
              items: [
                {
                  t: "ROOM_BLOCKED written",
                  s: "Admin, date, reason",
                  e: "neutral",
                },
                { t: "ROOM_UNBLOCKED written", s: "Admin, date", e: "neutral" },
              ],
            },
          ],
        },
      };

      const SPEED_FACTORS = [30, 16, 8, 3, 0.2];
      const SPEED_LABELS = ["0.05×", "0.1×", "0.2×", "0.5×", "5×"];
      let activeFlow = "draft";
      const instances = {};

      function renderNav() {
        const nav = document.getElementById("nav");
        nav.innerHTML = "";
        Object.keys(FLOWS).forEach((key) => {
          const btn = document.createElement("button");
          btn.className = "nav-btn" + (key === activeFlow ? " active" : "");
          btn.textContent = FLOWS[key].label;
          btn.onclick = () => {
            activeFlow = key;
            renderFlow();
            renderNav();
          };
          nav.appendChild(btn);
        });
      }

      function renderFlow() {
        const flow = FLOWS[activeFlow];
        document.getElementById("flow-title").textContent = flow.desc;
        const container = document.getElementById("panels");
        container.innerHTML = "";
        instances[activeFlow] = instances[activeFlow] || {
          running: false,
          timers: [],
          domIds: [],
        };
        const inst = instances[activeFlow];
        inst.domIds = [];
        let domCount = 0;

        flow.panels.forEach((panel, pi) => {
          const p = document.createElement("div");
          p.className = "panel";
          p.innerHTML = `
        <div class="panel-header">
          <span class="panel-label">${panel.label}</span>
          ${pi === 0 ? `<span class="badge ${inst.running ? "live" : ""}" id="badge-${activeFlow}">${inst.running ? flow.to : flow.from}</span>` : ""}
        </div>
      `;
          if (pi === 0) {
            const sr = document.createElement("div");
            sr.className = "speed-row";
            sr.innerHTML = `<label>SLOW</label><input type="range" id="speed-${activeFlow}" min="1" max="5" value="2" step="1"><label>FAST</label><span class="speed-val" id="speedval-${activeFlow}">${SPEED_LABELS[1]}</span>`;
            p.appendChild(sr);
            const btns = document.createElement("div");
            btns.className = "btns";
            btns.innerHTML = `<button class="fire-btn" id="fire-${activeFlow}" ${inst.running ? "disabled" : ""}>▶ fire</button><button class="reset-btn" id="reset-${activeFlow}">↺ reset</button>`;
            p.appendChild(btns);
            sr.querySelector("input").addEventListener("input", function () {
              document.getElementById(`speedval-${activeFlow}`).textContent =
                SPEED_LABELS[this.value - 1];
            });
          }
          const slLabel = document.createElement("div");
          slLabel.className = "sec-label";
          slLabel.textContent = panel.label;
          p.appendChild(slLabel);
          const row = document.createElement("div");
          row.className = "domino-row";
          panel.items.forEach((item) => {
            const id = `dom-${activeFlow}-${domCount++}`;
            inst.domIds.push(id);
            const d = document.createElement("div");
            d.className = `domino ${item.e}${inst.running ? " fired" : ""}`;
            d.id = id;
            d.innerHTML = `<div class="dom-title">${item.t}</div><div class="dom-sub">${item.s}</div>`;
            row.appendChild(d);
          });
          p.appendChild(row);
          container.appendChild(p);
        });

        const fireBtn = document.getElementById(`fire-${activeFlow}`);
        const resetBtn = document.getElementById(`reset-${activeFlow}`);
        if (!fireBtn) return;

        const baseDelays = inst.domIds.map((_, i) => i * 280);
        function getDelays() {
          const v = parseInt(
            document.getElementById(`speed-${activeFlow}`).value,
          );
          return baseDelays.map((d) => Math.round(d * SPEED_FACTORS[v - 1]));
        }

        fireBtn.addEventListener("click", () => {
          if (inst.running) return;
          inst.running = true;
          fireBtn.disabled = true;
          const badge = document.getElementById(`badge-${activeFlow}`);
          if (badge) {
            badge.textContent = flow.to;
            badge.classList.add("live");
          }
          getDelays().forEach((ms, i) => {
            const t = setTimeout(() => {
              const el = document.getElementById(inst.domIds[i]);
              if (el) el.classList.add("fired");
            }, ms);
            inst.timers.push(t);
          });
        });

        resetBtn.addEventListener("click", () => {
          inst.timers.forEach(clearTimeout);
          inst.timers = [];
          inst.running = false;
          inst.domIds.forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.classList.remove("fired");
          });
          fireBtn.disabled = false;
          const badge = document.getElementById(`badge-${activeFlow}`);
          if (badge) {
            badge.textContent = flow.from;
            badge.classList.remove("live");
          }
        });
      }

      renderNav();
      renderFlow();
    </script>
  </body>
</html>
